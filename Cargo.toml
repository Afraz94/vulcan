[package]
name = "vulcan"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sled = "0.34.7"
keyring-core = "1.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true      
codegen-units = 1
panic = "abort"
strip = true