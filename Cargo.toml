[workspace]
members = [
    "vulcan-login",
    "vulcan-storage",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.52.3", features = ["full"] }
keyring = "4.1.2"
notify = "8.2.0"
secrecy = "0.10.3"

# Aggressive release optimization definitions apply across all sub-crates automatically
[profile.release]
opt-level = 3
lto = true      
codegen-units = 1
panic = "abort"
strip = true